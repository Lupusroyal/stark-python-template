name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  quality:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stark_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true


      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"


      - name: Install dependencies
        run: uv sync --frozen


      - name: Run Ruff
        run: uv run ruff check .


      - name: Run MyPy
        run: uv run mypy .


      - name: Run Tests
        run: uv run pytest
