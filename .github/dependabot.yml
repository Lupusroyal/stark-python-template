version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: weekly

    open-pull-requests-limit: 5

    groups:
      python-dependencies:
        patterns:
          - "*"

    commit-message:
      prefix: "chore"


  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly

    open-pull-requests-limit: 5

    groups:
      github-actions:
        patterns:
          - "*"

    commit-message:
      prefix: "ci"
