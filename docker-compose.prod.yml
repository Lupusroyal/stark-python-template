services:
  stark-api:
    build: .
    env_file:
      - .env.production
    ports:
      - "8080:8000"
    command: uv run uvicorn stark.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3


  postgres:
    image: postgres:17
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: stark_db
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d stark_db"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres_prod_data:
