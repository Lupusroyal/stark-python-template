[project]
name = "stark-python-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "email-validator>=2.3.0",
    "fastapi>=0.139.2",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipython>=9.16.0",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pytest-dotenv>=0.5.2",
    "ruff>=0.16.0",
    "types-python-jose>=3.5.0.20260408",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stark"]

[tool.mypy]
plugins = ["pydantic.mypy"]
exclude = "alembic/"

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
env_files = [
    ".env.test"
]
