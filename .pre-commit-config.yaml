repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: Type checking (mypy)
        entry: uv run mypy .
        language: system
        pass_filenames: false

      - id: pytest
        name: Tests (pytest)
        entry: uv run pytest
        language: system
        pass_filenames: false
